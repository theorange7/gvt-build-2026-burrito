name: Deploy server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      function_app_name:
        description: Azure Function App name
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Build and package server artifact
        run: pnpm -C server package

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy zip to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name "${{ inputs.function_app_name }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --src server/wrap-server.zip

      - name: Smoke test
        run: |
          APP_URL="https://${{ inputs.function_app_name }}.azurewebsites.net"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/auth/register" -X POST -H "Content-Type: application/json" -d '{}')
          if [[ "$STATUS" != "200" && "$STATUS" != "400" && "$STATUS" != "422" ]]; then
            echo "Smoke test failed: /api/auth/register returned HTTP $STATUS"
            exit 1
          fi
          echo "Smoke test passed (HTTP $STATUS)"
