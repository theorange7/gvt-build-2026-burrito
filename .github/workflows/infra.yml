name: Infra (Terraform)

on:
  push:
    branches: [main]
    paths: [infra/**]
  pull_request:
    paths: [infra/**]
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (default: plan only)"
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC token for Azure login
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform plan / apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    defaults:
      run:
        working-directory: infra/

    env:
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Secrets are injected as TF_VAR_* so they never appear in tfvars
      TF_VAR_wrap_jwt_secret: ${{ secrets.WRAP_JWT_SECRET }}
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_azure_foundry_project_endpoint: ${{ secrets.AZURE_FOUNDRY_PROJECT_ENDPOINT }}
      TF_VAR_azure_foundry_api_version: ${{ secrets.AZURE_FOUNDRY_API_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n…(truncated)' : plan;
            const body = `## Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## Terraform Plan'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Terraform apply
        if: >
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        run: terraform apply -auto-approve tfplan
