name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANTHROPIC_API_KEY: test-stubbed-key

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  client:
    name: Client (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  server:
    name: Server (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Server typecheck
        run: pnpm -C server typecheck

      - name: Server tests
        run: pnpm -C server test

      - name: Server build
        run: pnpm -C server build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [client]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Run Playwright
        run: pnpm test:e2e

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

  tauri-check:
    name: Tauri crate check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3.0.3
        id: filter
        with:
          filters: |
            shell:
              - 'src-tauri/**'
              - 'scripts/tauri-csp.mjs'
              - 'next.config.mjs'

      - name: Install Linux build deps for tauri-build
        if: steps.filter.outputs.shell == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            build-essential

      - name: Cache cargo registry
        if: steps.filter.outputs.shell == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-check-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: cargo check
        if: steps.filter.outputs.shell == 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3.0.3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        if: steps.filter.outputs.infra == 'true'

      - name: Terraform fmt check
        if: steps.filter.outputs.infra == 'true'
        working-directory: infra
        run: terraform fmt -check

      - name: Terraform init
        if: steps.filter.outputs.infra == 'true'
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform validate
        if: steps.filter.outputs.infra == 'true'
        working-directory: infra
        run: terraform validate

  status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [client, server, e2e, tauri-check, terraform-validate]
    if: always()
    steps:
      - name: Report status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == 'true' ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."


  ai-live-smoke:
    name: AI live smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTEGRATION_LIVE: '1'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live AI smoke
        run: pnpm ai:test:live

  uat-full:
    name: UAT full-stack (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UAT_FULL: '1'
      NEXT_PUBLIC_WRAP_API_URL: 'http://localhost:7071/api'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WRAP_JWT_SECRET: ${{ secrets.WRAP_JWT_SECRET }}
      AZURE_TABLES_ENDPOINT: ${{ secrets.AZURE_TABLES_ENDPOINT }}
      AZURE_FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_PROJECT_ENDPOINT }}
      ServiceBusConnection: ${{ secrets.AZURE_SERVICE_BUS_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && cd server && pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Start backend
        run: cd server && pnpm exec func start &

      - name: Wait for backend
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:7071/api/health 2>/dev/null && break
            sleep 2
          done

      - name: Run UAT full-stack
        run: pnpm test:uat:full

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-uat-full
          path: playwright-report/
          retention-days: 7
