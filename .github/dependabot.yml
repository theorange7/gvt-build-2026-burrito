version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: next
        update-types:
          - version-update:semver-major
    groups:
      client-dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
      client-prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-dependencies:
        patterns:
          - '*'

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
