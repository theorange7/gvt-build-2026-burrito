<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Burrito · C4 Container Diagram</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0A1622; }
    body { font-family: 'IBM Plex Sans', sans-serif; }
    .wrap { padding: 24px; }
    .hint { margin-top: 12px; max-width: 1440px; font-size: 10px; color: #1A3A5A; }
    .panel {
      margin-top: 16px; max-width: 1440px;
      background: #0C1D2E;
      padding: 18px 22px; border-radius: 6px;
      color: #D8E6F2;
    }
    .panel-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .panel-title {
      font-family: 'IBM Plex Mono', monospace; font-weight: 700;
      font-size: 14px; color: #fff;
    }
    .panel-close {
      background: transparent; color: #7AB6E0;
      border: 1px solid #1A3A5A; border-radius: 4px;
      padding: 4px 10px; cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif; font-size: 11px;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }
    .panel-item {
      background: #0A1622; padding: 12px; border-radius: 4px;
    }
    .panel-item-title { font-weight: 600; font-size: 12px; margin-bottom: 6px; color: #fff; }
    .panel-item-body { font-size: 11px; color: #9EC5F5; line-height: 1.5; }
    .panel-note {
      margin-top: 14px; font-size: 11px; font-style: italic;
      color: #7AB6E0; border-top: 1px solid #1A3A5A; padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" />
    <div id="root"></div>
  </div>

  <script>
    function App(container) {
      // ----- Layout constants -----
      const W = 1440, H = 870;

      // Person
      const PERSON_X = 305, PERSON_Y = 18, PERSON_W = 180;

      // Contribution Sources [External] boundary (leftmost column)
      const SOURCES_X = 18, SOURCES_Y = 180, SOURCES_W = 192, SOURCES_H = 250;
      const PULL_X = 28, PULL_Y = 225, PULL_W = 172, PULL_H = 120;

      // Client boundary
      const CLIENT_X = 260, CLIENT_Y = 100;
      const CLIENT_W = 260, CLIENT_H = 675;

      // Client components
      const COMP_X = 278, COMP_W = 224, COMP_H = 96;
      const COMP1_Y = 130;
      const COMP2_Y = 262;
      const COMP3_Y = 394;
      const COMP4_Y = 526;
      const COMP5_Y = 658;

      // Adapter Layer
      const ADAPTER_X = 532, ADAPTER_Y = 130;
      const ADAPTER_W = 22, ADAPTER_H = 630;

      // System (Azure) boundary
      const SYS_X = 568, SYS_Y = 100;
      const SYS_W = 700, SYS_H = 730;

      // Auth Service
      const AUTH_X = 600, AUTH_Y = 270;
      const AUTH_W = 200, AUTH_H = 130;

      // inviteCodes Table (Azure Table Storage — NEW)
      const IC_X = 600, IC_Y = 414;
      const IC_W = 200, IC_H = 88;

      // Backend Services boundary
      const BACK_X = 840, BACK_Y = 130;
      const BACK_W = 280, BACK_H = 560;

      // Backend components
      const WRAP_X = 856, WRAP_Y = 160, WRAP_W = 248, WRAP_H = 110;
      const QUEUE_X = 856, QUEUE_Y = 314, QUEUE_W = 248, QUEUE_H = 80;
      const CLASS_X = 856, CLASS_Y = 438, CLASS_W = 248, CLASS_H = 110;
      const IMPORT_X = 856, IMPORT_Y = 592, IMPORT_W = 248, IMPORT_H = 80;

      // Composer
      const COMPOSER_X = 840, COMPOSER_Y = 714, COMPOSER_W = 280, COMPOSER_H = 100;

      // Azure Blob Storage (right column, inside Azure boundary)
      const BSHARE_X = 1143, BSHARE_Y = 314, BSHARE_W = 112, BSHARE_H = 130;
      const BDL_X = 1143, BDL_Y = 490, BDL_W = 112, BDL_H = 110;

      // LLM Providers [External] boundary (outside Azure boundary, far-right column)
      const LLM_X = 1284, LLM_Y = 130, LLM_W = 148, LLM_H = 490;
      const ANTHRO_X = 1294, ANTHRO_Y = 165, ANTHRO_W = 128, ANTHRO_H = 100;
      const FOUNDRY_X = 1294, FOUNDRY_Y = 299, FOUNDRY_W = 128, FOUNDRY_H = 100;
      const OLLAMA_X = 1294, OLLAMA_Y = 433, OLLAMA_W = 128, OLLAMA_H = 100;

      // ----- Colors -----
      const C4 = {
        person:    { bg: "#1B4F8A", border: "#0D3468", text: "#fff", sub: "#9EC5F5" },
        auth:      { bg: "#0D5C45", border: "#08402F", text: "#fff", sub: "#5FD9B0" },
        container: { bg: "#1168BD", border: "#0A4F94", text: "#fff", sub: "#9EC5F5" },
        component: { bg: "#2C6EA6", border: "#1C508A", text: "#fff", sub: "#B8D8F5" },
        external:  { bg: "#555555", border: "#383838", text: "#fff", sub: "#C0C0C0" },
        storage:   { bg: "#0F6674", border: "#084650", text: "#fff", sub: "#7DD5DF" },
        test:      { bg: "#4A2E7A", border: "#321D56", text: "#fff", sub: "#C0A0F0" },
        bound:     { fill: "rgba(17,104,189,0.05)", stroke: "#1168BD" },
        extbound:  { fill: "rgba(85,85,85,0.05)",   stroke: "#505050" },
      };

      const MONO = "'IBM Plex Mono', monospace";
      const SANS = "'IBM Plex Sans', sans-serif";

      let panel = null;
      function tog(k) { panel = (panel === k ? null : k); render(); }

      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function Box({ x, y, w, h, type, label, tech, desc, active, onClick }) {
        const c = C4[type];
        const stroke = active ? "#FFD060" : c.border;
        const sw = active ? 2.5 : 1.5;
        const labelY = tech ? y + 34 : y + 24;
        const cursor = onClick ? 'pointer' : 'default';
        const evt = onClick ? `data-onclick="${esc(onClick)}"` : '';
        const techSvg = tech
          ? `<text x="${x + w/2}" y="${y + 17}" font-family="${SANS}" font-style="italic" font-size="8.5" fill="${c.sub}" text-anchor="middle">[${esc(tech)}]</text>`
          : '';
        const descSvg = desc
          ? `<foreignObject x="${x + 8}" y="${labelY + 6}" width="${w - 16}" height="${Math.max(0, h - (labelY - y) - 10)}">
              <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:${SANS};font-size:9px;color:${c.sub};line-height:1.45;text-align:center;white-space:pre-wrap;">${esc(desc)}</div>
            </foreignObject>`
          : '';
        return `<g style="cursor:${cursor}" ${evt} filter="url(#sh)">
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${c.bg}" stroke="${stroke}" stroke-width="${sw}"/>
          ${techSvg}
          <text x="${x + w/2}" y="${labelY}" font-family="${MONO}" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">${esc(label)}</text>
          ${descSvg}
        </g>`;
      }

      function Cylinder({ x, y, w, h, label, tech, desc, active, onClick }) {
        const c = C4.storage;
        const stroke = active ? "#FFD060" : c.border;
        const sw = active ? 2.5 : 1.5;
        const ry = 11;
        const cursor = onClick ? 'pointer' : 'default';
        const evt = onClick ? `data-onclick="${esc(onClick)}"` : '';
        const techSvg = tech
          ? `<text x="${x + w/2}" y="${y + 38}" font-family="${SANS}" font-style="italic" font-size="8.5" fill="${c.sub}" text-anchor="middle">[${esc(tech)}]</text>`
          : '';
        const descSvg = desc
          ? `<foreignObject x="${x + 8}" y="${y + 62}" width="${w - 16}" height="${Math.max(0, h - 68)}">
              <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:${SANS};font-size:9px;color:${c.sub};line-height:1.45;text-align:center;white-space:pre-wrap;">${esc(desc)}</div>
            </foreignObject>`
          : '';
        return `<g style="cursor:${cursor}" ${evt} filter="url(#sh)">
          <path d="M ${x},${y + ry} L ${x},${y + h - ry} A ${w/2},${ry} 0 0 0 ${x + w},${y + h - ry} L ${x + w},${y + ry}" fill="${c.bg}" stroke="${stroke}" stroke-width="${sw}"/>
          <ellipse cx="${x + w/2}" cy="${y + ry}" rx="${w/2}" ry="${ry}" fill="${c.bg}" stroke="${stroke}" stroke-width="${sw}"/>
          <ellipse cx="${x + w/2}" cy="${y + ry}" rx="${Math.max(0, w/2 - 8)}" ry="6" fill="#0A7A8A" opacity="0.55"/>
          ${techSvg}
          <text x="${x + w/2}" y="${y + 56}" font-family="${MONO}" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">${esc(label)}</text>
          ${descSvg}
        </g>`;
      }

      function Person({ x, y, w, label, sub }) {
        const c = C4.person;
        const cx = x + w/2;
        return `<g filter="url(#sh)">
          <circle cx="${cx}" cy="${y + 14}" r="14" fill="${c.bg}" stroke="${c.border}" stroke-width="1.5"/>
          <rect x="${x}" y="${y + 32}" width="${w}" height="44" rx="6" fill="${c.bg}" stroke="${c.border}" stroke-width="1.5"/>
          <text x="${cx}" y="${y + 45}" font-family="${SANS}" font-style="italic" font-size="8.5" fill="${c.sub}" text-anchor="middle">[Person]</text>
          <text x="${cx}" y="${y + 60}" font-family="${MONO}" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">${esc(label)}</text>
          ${sub ? `<text x="${cx}" y="${y + 72}" font-family="${SANS}" font-size="9" fill="${c.sub}" text-anchor="middle">${esc(sub)}</text>` : ''}
        </g>`;
      }

      function Boundary({ x, y, w, h, label, onClick, active, kind }) {
        const isExt = kind === 'external';
        const defStroke = isExt ? C4.extbound.stroke : C4.bound.stroke;
        const defFill  = isExt ? C4.extbound.fill  : C4.bound.fill;
        const stroke = active ? "#FFD060" : defStroke;
        const fill   = active ? "rgba(255,208,96,0.04)" : defFill;
        const sw = active ? 2.5 : 1.5;
        const pillW = label.length * 7 + 18;
        const cursor = onClick ? 'pointer' : 'default';
        const evt = onClick ? `data-onclick="${esc(onClick)}"` : '';
        return `<g style="cursor:${cursor}" ${evt}>
          <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="8,5"/>
          <rect x="${x + 14}" y="${y - 10}" width="${pillW}" height="20" rx="4" fill="#071524" stroke="${stroke}" stroke-width="1"/>
          <text x="${x + 14 + pillW/2}" y="${y + 4}" font-family="${MONO}" font-weight="bold" font-size="10" fill="${stroke}" text-anchor="middle">${esc(label)}</text>
        </g>`;
      }

      function Arrow({ x1, y1, x2, y2, label, dashed, cx1, cy1, cx2, cy2, lx, ly }) {
        const d = cx1 !== undefined
          ? `M ${x1},${y1} C ${cx1},${cy1} ${cx2},${cy2} ${x2},${y2}`
          : `M ${x1},${y1} L ${x2},${y2}`;
        const mx = lx !== undefined ? lx : (x1 + x2) / 2;
        const my = ly !== undefined ? ly : (y1 + y2) / 2;
        const labelW = label ? label.length * 5.6 + 8 : 0;
        const dash = dashed ? ' stroke-dasharray="5,4"' : '';
        const labelSvg = label
          ? `<g>
              <rect x="${mx - labelW/2}" y="${my - 7}" width="${labelW}" height="13" rx="2" fill="#07111F" opacity="0.92"/>
              <text x="${mx}" y="${my + 3}" font-family="${SANS}" font-size="9" fill="#7AB6E0" text-anchor="middle">${esc(label)}</text>
            </g>`
          : '';
        return `<g>
          <path d="${d}" fill="none" stroke="#4A8EC4" stroke-width="1.5" opacity="0.82"${dash} marker-end="url(#arr)"/>
          ${labelSvg}
        </g>`;
      }

      // ----- Panel data -----
      const panels = {
        auth: {
          title: "Auth Service [Gateway]",
          color: C4.auth.sub,
          items: [
            ["🎟️ Invite Code Gate", "POST /auth/register validates invite code against Azure Table Storage (inviteCodes). Falls back to INVITE_CODES env var if table not configured. Stamps usedAt on first use."],
            ["🔐 Token Validation", "Verifies Bearer tokens on every inbound request before passing to any service"],
            ["🗺️ Route Dispatcher", "Inspects path prefix — routes /wrap, /classify, /queue, /compose, /import to correct downstream"],
            ["🚦 Rate Limiting", "Per-client throttling to protect backend services"],
            ["📋 Audit Log", "All auth decisions logged for compliance and debugging"],
          ],
          note: "Single entry point. Invite code checked at /auth/register; per-install JWT issued on success. Each invite code gets its own isolated IndexedDB on the client (wrapped-for-work-{slug}).",
        },
        backend: {
          title: "Backend Services [Azure Container Apps]",
          color: C4.container.sub,
          items: [
            ["🎁 Wrapper Generator", "Orchestrates wrap creation; fans out across 10 slice prompts via callModel(); writes result to Blob Shareable"],
            ["📬 Queue", "Azure Service Bus — async job queue for long-running generation tasks"],
            ["🏷️ Contribution Classifier", "POST /classify — LLM call: tags and categorises a single contribution signal"],
            ["📂 Import Handler", "POST /import — synchronous LLM extraction from uploaded file (256 KB cap). No persistence, no queue. Returns NormalizedContribution[]."],
          ],
          note: "All services only reachable via Auth Service. callModel() dispatches to Anthropic API, Azure AI Foundry, or OLLAMA per models.config.json.",
        },
        composer: {
          title: "Composer [Independent Service]",
          color: C4.container.sub,
          items: [
            ["🎵 Music Assembly", "Selects and layers background music tracks for the wrap"],
            ["📊 Slide Builder", "Renders contribution data into slide layouts"],
            ["📦 Package Writer", "Bundles final asset and writes to Blob Download"],
          ],
          note: "Independent Azure service — separate from Backend Services boundary. Auth routes POST /compose here directly by path.",
        },
        shareable: {
          title: "Blob: Shareable",
          color: C4.storage.sub,
          items: [
            ["💾 Cache Layer", "Generated asset cache keyed by owner"],
            ["✏️ Owner Access", "r/w — creator can update their wrap asset"],
            ["👁️ Public Access", "all:r — share link is publicly readable by anyone"],
          ],
          note: "Azure Blob Storage with tiered ACL. Wrapper Generator writes here; shareable links point here.",
        },
        providers: {
          title: "Contribution Sources [External]",
          color: C4.external.sub,
          items: [
            ["🔄 Pull Providers", "GitHub, GitLab Dedicated, Jira — OAuth PKCE + cursor-based event sync via ContributionProvider adapters in src/lib/providers/"],
            ["📁 File Upload", "One-shot push path: user drops a file → POST /import → LLM extracts contributions in-memory → discarded. Never stored server-side."],
            ["🔌 Provider Abstraction", "Each source implements ContributionProvider: auth + identity + sync (pull) or import (push). Orchestrator owns encryption and persistence."],
          ],
          note: "All contributions — synced or file-extracted — are encrypted on-device. File upload is the only path where content leaves the device.",
        },
        llm: {
          title: "LLM Providers [External]",
          color: C4.external.sub,
          items: [
            ["🤖 Anthropic API", "Direct POST to api.anthropic.com with ANTHROPIC_API_KEY. Three-attempt retry on 429/529. Used for classify, wrap generation, and file import."],
            ["☁️ Azure AI Foundry", "AIProjectClient → getAzureOpenAIClient. Deployment name = modelId in models.config.json. DefaultAzureCredential auth."],
            ["🖥️ OLLAMA", "Local model inference via localhost:11434. Opt-in — no entry ships enabled by default. Configured per-model via baseUrl in models.config.json."],
          ],
          note: "Active provider selected per-model in models.config.json. callModel() in server/src/ai/client.ts dispatches to the matching ProviderAdapter.",
        },
      };

      // ----- SVG assembly -----
      function buildSvg() {
        const legend = [
          ["Person", C4.person.bg],
          ["Auth Gateway", C4.auth.bg],
          ["Container", C4.container.bg],
          ["Component", C4.component.bg],
          ["Storage", C4.storage.bg],
          ["External", C4.external.bg],
        ];

        return `
<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#07111F"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0B1E30" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4A8EC4"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="${W}" height="${H}" fill="url(#grid)"/>

  <!-- Boundaries (render before boxes so boxes sit on top) -->
  ${Boundary({ x: SOURCES_X, y: SOURCES_Y, w: SOURCES_W, h: SOURCES_H,
               label: "Contribution Sources [External]",
               onClick: 'providers', active: panel === 'providers', kind: 'external' })}
  ${Boundary({ x: CLIENT_X, y: CLIENT_Y, w: CLIENT_W, h: CLIENT_H,
               label: "Client [Browser / Tauri]" })}
  ${Boundary({ x: SYS_X, y: SYS_Y, w: SYS_W, h: SYS_H,
               label: "Burrito System [Azure]" })}
  ${Boundary({ x: BACK_X, y: BACK_Y, w: BACK_W, h: BACK_H,
               label: "Backend Services [Container Apps]",
               onClick: 'backend', active: panel === 'backend' })}
  ${Boundary({ x: LLM_X, y: LLM_Y, w: LLM_W, h: LLM_H,
               label: "LLM Providers [External]",
               onClick: 'llm', active: panel === 'llm', kind: 'external' })}

  <!-- Arrows (render before boxes) -->
  ${Arrow({ x1: PERSON_X + PERSON_W/2, y1: PERSON_Y + 78,
            x2: CLIENT_X + CLIENT_W/2, y2: CLIENT_Y,
            label: "uses" })}
  ${Arrow({ x1: PULL_X + PULL_W, y1: PULL_Y + PULL_H/2,
            x2: COMP_X, y2: COMP1_Y + COMP_H/2,
            cx1: 240, cy1: PULL_Y + PULL_H/2,
            cx2: 258, cy2: COMP1_Y + COMP_H/2,
            label: "sync pull",
            lx: 228, ly: COMP1_Y + COMP_H/2 + 28 })}
  ${Arrow({ x1: ADAPTER_X + ADAPTER_W, y1: AUTH_Y + AUTH_H/2,
            x2: AUTH_X, y2: AUTH_Y + AUTH_H/2,
            label: "JSON contract" })}
  ${Arrow({ x1: AUTH_X + AUTH_W, y1: AUTH_Y + AUTH_H - 18,
            x2: IC_X + IC_W, y2: IC_Y + 18,
            cx1: AUTH_X + AUTH_W + 36, cy1: AUTH_Y + AUTH_H - 18,
            cx2: IC_X + IC_W + 36, cy2: IC_Y + 18,
            label: "validate code",
            lx: IC_X + IC_W + 64, ly: (AUTH_Y + AUTH_H + IC_Y)/2 })}
  ${Arrow({ x1: AUTH_X + AUTH_W, y1: AUTH_Y + 22,
            x2: WRAP_X, y2: WRAP_Y + 28,
            cx1: AUTH_X + AUTH_W + 22, cy1: AUTH_Y + 18,
            cx2: WRAP_X - 16, cy2: WRAP_Y + 28,
            label: "POST /wrap",
            lx: (AUTH_X + AUTH_W + WRAP_X)/2, ly: WRAP_Y + 12 })}
  ${Arrow({ x1: AUTH_X + AUTH_W, y1: AUTH_Y + 42,
            x2: WRAP_X, y2: WRAP_Y + WRAP_H - 24,
            cx1: AUTH_X + AUTH_W + 22, cy1: AUTH_Y + 38,
            cx2: WRAP_X - 16, cy2: WRAP_Y + WRAP_H - 24,
            label: "GET /wrap/{jobId}",
            lx: (AUTH_X + AUTH_W + WRAP_X)/2, ly: WRAP_Y + WRAP_H - 10 })}
  ${Arrow({ x1: WRAP_X + WRAP_W/2, y1: WRAP_Y + WRAP_H,
            x2: QUEUE_X + QUEUE_W/2, y2: QUEUE_Y,
            label: "enqueue",
            lx: WRAP_X + WRAP_W/2 + 40, ly: (WRAP_Y + WRAP_H + QUEUE_Y)/2 })}
  ${Arrow({ x1: QUEUE_X + QUEUE_W/2, y1: QUEUE_Y,
            x2: WRAP_X + WRAP_W/2, y2: WRAP_Y + WRAP_H,
            label: "SB trigger",
            lx: QUEUE_X + QUEUE_W/2 + 42, ly: (QUEUE_Y + WRAP_Y + WRAP_H)/2 })}
  ${Arrow({ x1: AUTH_X + AUTH_W, y1: AUTH_Y + AUTH_H - 30,
            x2: CLASS_X, y2: CLASS_Y + CLASS_H/2,
            cx1: AUTH_X + AUTH_W + 22, cy1: AUTH_Y + AUTH_H - 26,
            cx2: CLASS_X - 16, cy2: CLASS_Y + CLASS_H/2,
            label: "POST /classify",
            lx: (AUTH_X + AUTH_W + CLASS_X)/2, ly: CLASS_Y + 8 })}
  ${Arrow({ x1: AUTH_X + AUTH_W, y1: AUTH_Y + AUTH_H - 10,
            x2: IMPORT_X, y2: IMPORT_Y + IMPORT_H/2,
            cx1: AUTH_X + AUTH_W + 28, cy1: AUTH_Y + AUTH_H - 6,
            cx2: IMPORT_X - 16, cy2: IMPORT_Y + IMPORT_H/2,
            label: "POST /import",
            lx: (AUTH_X + AUTH_W + IMPORT_X)/2, ly: IMPORT_Y - 12 })}
  ${Arrow({ x1: AUTH_X + AUTH_W/2, y1: AUTH_Y + AUTH_H,
            x2: COMPOSER_X, y2: COMPOSER_Y + COMPOSER_H/2,
            cx1: AUTH_X + AUTH_W/2, cy1: COMPOSER_Y + COMPOSER_H/2,
            cx2: COMPOSER_X - 50, cy2: COMPOSER_Y + COMPOSER_H/2,
            label: "POST /compose",
            lx: AUTH_X + AUTH_W/2 + 70, ly: COMPOSER_Y + COMPOSER_H/2 + 14 })}
  ${Arrow({ x1: WRAP_X + WRAP_W, y1: WRAP_Y + 18,
            x2: LLM_X, y2: ANTHRO_Y + ANTHRO_H/2,
            cx1: WRAP_X + WRAP_W + 78, cy1: WRAP_Y - 4,
            cx2: LLM_X - 18, cy2: ANTHRO_Y + 22,
            label: "callModel()",
            lx: WRAP_X + WRAP_W + 92, ly: WRAP_Y - 8 })}
  ${Arrow({ x1: WRAP_X + WRAP_W, y1: WRAP_Y + WRAP_H - 20,
            x2: BSHARE_X + BSHARE_W/2, y2: BSHARE_Y,
            cx1: WRAP_X + WRAP_W + 20, cy1: WRAP_Y + WRAP_H + 12,
            cx2: BSHARE_X + BSHARE_W/2, cy2: BSHARE_Y - 20,
            label: "store result",
            lx: WRAP_X + WRAP_W + 42, ly: WRAP_Y + WRAP_H + 10 })}
  ${Arrow({ x1: COMPOSER_X + COMPOSER_W, y1: COMPOSER_Y + COMPOSER_H/2,
            x2: BDL_X, y2: BDL_Y + BDL_H/2,
            cx1: COMPOSER_X + COMPOSER_W + 18, cy1: COMPOSER_Y + COMPOSER_H/2,
            cx2: BDL_X - 18, cy2: BDL_Y + BDL_H/2,
            label: "write asset" })}

  <!-- Person -->
  ${Person({ x: PERSON_X, y: PERSON_Y, w: PERSON_W, label: "User", sub: "Browser / Tauri" })}

  <!-- Contribution Sources: Pull Providers box -->
  ${Box({ x: PULL_X, y: PULL_Y, w: PULL_W, h: PULL_H, type: "external",
          label: "Pull Providers",
          tech: "GitHub · GitLab · Jira",
          desc: "OAuth PKCE + cursor-based event sync via ContributionProvider adapters" })}

  <!-- Client components -->
  ${Box({ x: COMP_X, y: COMP1_Y, w: COMP_W, h: COMP_H, type: "component",
          label: "Contribution Timeline", tech: "UI component",
          desc: "Sync providers + manual input" })}
  ${Box({ x: COMP_X, y: COMP2_Y, w: COMP_W, h: COMP_H, type: "component",
          label: "Wrapped Viewer", tech: "UI component",
          desc: "Playback, request and completed state" })}
  ${Box({ x: COMP_X, y: COMP3_Y, w: COMP_W, h: COMP_H, type: "component",
          label: "Auto Classifier", tech: "WASM / JS",
          desc: "Pre-classification before upload" })}
  ${Box({ x: COMP_X, y: COMP4_Y, w: COMP_W, h: COMP_H, type: "component",
          label: "Personal Vault", tech: "IndexedDB",
          desc: "Per-invite-code encrypted store\n(wrapped-for-work-{slug})" })}
  ${Box({ x: COMP_X, y: COMP5_Y, w: COMP_W, h: COMP_H, type: "component",
          label: "File Import Panel", tech: "UI component",
          desc: "Two-step modal: label → file + egress disclosure · POST /import" })}

  <!-- Adapter Layer -->
  <g>
    <rect x="${ADAPTER_X}" y="${ADAPTER_Y}" width="${ADAPTER_W}" height="${ADAPTER_H}" rx="3" fill="#0F2540" stroke="#1A3A60" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="${ADAPTER_X + ADAPTER_W/2}" y="${ADAPTER_Y + ADAPTER_H/2}" font-family="${MONO}" font-size="8.5" fill="#2A5A90" text-anchor="middle" transform="rotate(-90 ${ADAPTER_X + ADAPTER_W/2} ${ADAPTER_Y + ADAPTER_H/2})">Adapter Layer</text>
  </g>

  <!-- Auth Service + GATEWAY badge -->
  ${Box({ x: AUTH_X, y: AUTH_Y, w: AUTH_W, h: AUTH_H, type: "auth",
          label: "Auth Service", tech: "Azure API Management",
          desc: "Invite-code gate · Token validation\nRoute dispatch · All traffic enters here first",
          active: panel === 'auth', onClick: 'auth' })}
  <g style="pointer-events:none">
    <rect x="${AUTH_X + AUTH_W - 64}" y="${AUTH_Y + 4}" width="58" height="14" rx="7" fill="#0D5C45" stroke="#5FD9B0" stroke-width="0.8"/>
    <text x="${AUTH_X + AUTH_W - 35}" y="${AUTH_Y + 14}" font-family="${MONO}" font-weight="bold" font-size="8" fill="#5FD9B0" text-anchor="middle">GATEWAY</text>
  </g>

  <!-- inviteCodes Table (NEW) -->
  ${Box({ x: IC_X, y: IC_Y, w: IC_W, h: IC_H, type: "storage",
          label: "inviteCodes Table", tech: "Azure Table Storage",
          desc: "PartitionKey: invite · RowKey: code\nactive · usedAt · createdAt" })}

  <!-- Backend components -->
  ${Box({ x: WRAP_X, y: WRAP_Y, w: WRAP_W, h: WRAP_H, type: "container",
          label: "Wrapper Generator", tech: "Azure Container Apps",
          desc: "Orchestrates wrap: 10 slice fan-out via callModel(). Writes result to Blob Shareable." })}
  ${Box({ x: QUEUE_X, y: QUEUE_Y, w: QUEUE_W, h: QUEUE_H, type: "component",
          label: "Queue", tech: "Azure Service Bus",
          desc: "Async job queue for generation tasks" })}
  ${Box({ x: CLASS_X, y: CLASS_Y, w: CLASS_W, h: CLASS_H, type: "container",
          label: "Contribution Classifier", tech: "Azure Container Apps",
          desc: "ML pipeline: tags and categorises contributions" })}
  ${Box({ x: IMPORT_X, y: IMPORT_Y, w: IMPORT_W, h: IMPORT_H, type: "component",
          label: "Import Handler", tech: "Azure Functions",
          desc: "POST /import — LLM extraction, 256 KB cap, no persistence" })}

  <!-- Composer + INDEPENDENT badge -->
  ${Box({ x: COMPOSER_X, y: COMPOSER_Y, w: COMPOSER_W, h: COMPOSER_H, type: "container",
          label: "Composer", tech: "Azure Container Apps  [independent]",
          desc: "Assembles slides + music. Auth routes /compose here directly.",
          active: panel === 'composer', onClick: 'composer' })}
  <g style="pointer-events:none">
    <rect x="${COMPOSER_X + 6}" y="${COMPOSER_Y + 4}" width="86" height="14" rx="7" fill="#1168BD" stroke="#9EC5F5" stroke-width="0.8"/>
    <text x="${COMPOSER_X + 49}" y="${COMPOSER_Y + 14}" font-family="${MONO}" font-weight="bold" font-size="8" fill="#9EC5F5" text-anchor="middle">INDEPENDENT</text>
  </g>

  <!-- Azure Blob Storage -->
  ${Cylinder({ x: BSHARE_X, y: BSHARE_Y, w: BSHARE_W, h: BSHARE_H,
               label: "Blob: Shareable", tech: "Azure Blob Storage",
               desc: "cache · owner:asset\nowner r/w · all:r",
               active: panel === 'shareable', onClick: 'shareable' })}
  ${Cylinder({ x: BDL_X, y: BDL_Y, w: BDL_W, h: BDL_H,
               label: "Blob: Download", tech: "Azure Blob Storage",
               desc: "Final packaged wraps for user download" })}

  <!-- LLM Providers (External, outside Azure boundary) -->
  ${Box({ x: ANTHRO_X, y: ANTHRO_Y, w: ANTHRO_W, h: ANTHRO_H, type: "external",
          label: "Anthropic API", tech: "api.anthropic.com",
          desc: "Classify · Wrap generation · File import\n3-attempt retry on 429/529" })}
  ${Box({ x: FOUNDRY_X, y: FOUNDRY_Y, w: FOUNDRY_W, h: FOUNDRY_H, type: "external",
          label: "Azure AI Foundry", tech: "*.services.ai.azure.com",
          desc: "LLM-as-a-Service via AIProjectClient\nDeployment name = modelId" })}
  ${Box({ x: OLLAMA_X, y: OLLAMA_Y, w: OLLAMA_W, h: OLLAMA_H, type: "external",
          label: "OLLAMA", tech: "Local LLM Runtime",
          desc: "Local model inference (opt-in)\nDefault: localhost:11434" })}

  <!-- Legend -->
  <g transform="translate(40, ${H - 50})">
    ${legend.map(([name, color], i) => `
      <g transform="translate(${i * 138}, 0)">
        <rect width="14" height="14" rx="2" fill="${color}" stroke="#1A3A60" stroke-width="0.5"/>
        <text x="20" y="11" font-family="${SANS}" font-size="9.5" fill="#4A6A8A">${esc(name)}</text>
      </g>`).join('')}
  </g>

  <!-- Footer -->
  <text x="${W - 24}" y="${H - 18}" font-family="${MONO}" font-size="9" fill="#2A4A6A" text-anchor="end">OUTPUT: JSON · Shareable URL · Download Package</text>
</svg>`;
      }

      // ----- Panel HTML -----
      function buildPanel() {
        if (!panel || !panels[panel]) return '';
        const p = panels[panel];
        const items = p.items.map(([title, body]) => `
          <div class="panel-item">
            <div class="panel-item-title">${esc(title)}</div>
            <div class="panel-item-body">${esc(body)}</div>
          </div>`).join('');
        return `
          <div class="panel" style="border-left:4px solid ${p.color};">
            <div class="panel-head">
              <div class="panel-title">${esc(p.title)}</div>
              <button class="panel-close" data-close="1">Close</button>
            </div>
            <div class="panel-grid">${items}</div>
            ${p.note ? `<div class="panel-note">${esc(p.note)}</div>` : ''}
          </div>`;
      }

      // ----- Render + event wiring -----
      function render() {
        container.innerHTML = `
          ${buildSvg()}
          <div class="hint">Click Contribution Sources · Auth Service (includes Invite Code Gate) · Backend Services boundary · Composer · Blob: Shareable · LLM Providers to expand details</div>
          ${buildPanel()}
        `;

        container.querySelectorAll('[data-onclick]').forEach(el => {
          el.addEventListener('click', () => tog(el.getAttribute('data-onclick')));
        });
        const closeBtn = container.querySelector('[data-close]');
        if (closeBtn) closeBtn.addEventListener('click', () => { panel = null; render(); });
      }

      render();
    }

    App(document.getElementById('root'));
  </script>
</body>
</html>
